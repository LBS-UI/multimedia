<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Multimedia Club Digital ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--amber:#FFD700;--gold:#FFE600;--bg:#050505;--text:#fffbea;--dim:#c8a84a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;display:flex;align-items:center;justify-content:center;padding:24px}
.panel{width:min(920px,100%);padding:32px;background:linear-gradient(160deg,rgba(28,20,4,.9),rgba(8,6,2,.96));border:1px solid rgba(255,215,0,.35);box-shadow:0 30px 90px rgba(0,0,0,.75),inset 0 0 90px rgba(255,215,0,.05);clip-path:polygon(0 20px,20px 0,calc(100% - 20px) 0,100% 20px,100% calc(100% - 20px),calc(100% - 20px) 100%,20px 100%,0 calc(100% - 20px))}
.hud{display:flex;justify-content:space-between;gap:12px;font-size:.7rem;letter-spacing:.2em;color:var(--dim);border-bottom:1px solid rgba(255,215,0,.2);padding-bottom:12px;margin-bottom:22px}
.identity{display:flex;gap:24px;align-items:center}
.avatar{width:132px;height:132px;position:relative;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(255,215,0,.3)}
.r1{inset:0;border-top-color:var(--amber);animation:spin 8s linear infinite}
.r2{inset:-10px;border-style:dashed;animation:spin 16s linear infinite reverse}
.core{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-weight:900;background:radial-gradient(circle at 34% 28%,rgba(255,215,0,.4),#17130c 72%);border:1px solid var(--amber);box-shadow:0 0 34px rgba(255,215,0,.28)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:Orbitron,sans-serif;font-size:clamp(1.5rem,4vw,2.4rem);color:#fff6d0;text-shadow:0 0 18px rgba(255,215,0,.45)}
.role{margin-top:10px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase}
.bio,.projects{margin-top:14px;line-height:1.7;color:#f3e7b3}
.project{border:1px solid rgba(255,215,0,.25);padding:10px;margin-top:8px}
.status{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:999px;font-weight:700}
.active{background:#16a34a}.inactive{background:#b45309}.revoked{background:#991b1b}
.links{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.link{padding:10px 16px;border:1px solid rgba(255,215,0,.35);color:#fff6d0;text-decoration:none;letter-spacing:.16em}
@media(max-width:680px){.identity{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<main class="panel" id="panel">
  <div class="hud"><span>MULTIMEDIA CLUB // DIGITAL ID</span><span id="online">CHECKING</span></div>
  <div class="identity">
    <div class="avatar"><div class="ring r1"></div><div class="ring r2"></div><div class="core" id="initials">MC</div></div>
    <div>
      <h1 id="name">Loading member…</h1>
      <p class="role" id="role">Official membership profile</p>
      <p class="bio" id="bio">Checking the club registry.</p>
      <p id="status"></p>
      <div class="projects" id="projects"></div>
      <div class="links"><a class="link" href="/">Back to club</a></div>
    </div>
  </div>
</main>
<script>
const id = new URLSearchParams(location.search).get("id") || "";
const nameEl = document.getElementById("name");
const roleEl = document.getElementById("role");
const bioEl = document.getElementById("bio");
const statusEl = document.getElementById("status");
const projectsEl = document.getElementById("projects");
const initials = document.getElementById("initials");
function esc(value){return String(value||"").replace(/[&<>"]/g,c=>({"&":"&","<":"<",">":">","\"":"""}[c]))}
if(!id){nameEl.textContent="Profile not found";bioEl.textContent="This QR does not include a member id."}
else{
  fetch("/api/public/members/"+encodeURIComponent(id))
    .then(r=>r.json().then(d=>({ok:r.ok,d})))
    .then(({ok,d})=>{
      if(!ok) throw new Error(d.error||"Member profile not found.");
      const m=d.member||{};
      nameEl.textContent=m.displayName||"Member";
      roleEl.textContent=(m.role||"Member")+" // "+(m.publicId||id);
      bioEl.textContent="This status was checked from the official Multimedia Club registry.";
      statusEl.innerHTML='<span class="status '+(m.status==="ACTIVE"?"active":m.status==="REVOKED"?"revoked":"inactive")+'">'+esc(m.status||"UNKNOWN")+'</span>';
      initials.textContent=(m.displayName||"MC").split(" ").map(p=>p[0]).join("").slice(0,2).toUpperCase();
      document.getElementById("online").textContent=m.status||"CHECKED";
      projectsEl.innerHTML=(d.projects||[]).map(p=>'<div class="project"><strong>'+esc(p.title)+'</strong><p>'+esc(p.description)+'</p></div>').join("")||"<p>No published projects yet.</p>";
    })
    .catch(e=>{nameEl.textContent="Verification unavailable";bioEl.textContent=e.message});
}
</script>
</body>
</html>
